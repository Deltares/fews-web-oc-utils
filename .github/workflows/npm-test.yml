name: Run checks & tests on Pull Requests

permissions:
  contents: read

on:
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts

      - name: Check formatting, lint and types
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit
