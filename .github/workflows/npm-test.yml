name: Run npm test & npm lint on Pull Requests

permissions:
  contents: read

on:
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm run test:unit

      - name: Run linter
        run: npm run lint
